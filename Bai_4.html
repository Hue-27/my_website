<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
   #menu {
    width: 250px;
    margin: auto;
   }
    #menu ul{
        list-style-type: none;
        border: 1px solid white;
        font-weight: bold;
        width: 250px;
        text-decoration: none;
        padding: 0;
        line-height: 40px;
        text-align: left;
        background-color: blue;
    }
    #menu li{
        padding: 0 1em;
        width: auto;
       border-bottom: 1px solid white;
      
    }
    #menu a{
        color: white;
        display: block;
        text-decoration: none;
    }
    #menu li:hover{
        background: red;
        
    }
</style>
<body>
    <div id="menu">
        <ul>
            <li><a href="">Chính trị-xã hội</a></li>
            <li><a href="">Thế giới</a></li>
            <li><a href="">Nhịp sống trẻ</a></li>
            <li><a href="">Giáo dục</a></li>
            <li><a href="">Kinh tế</a></li>
        </ul>
    </div>
</body>
</html>
